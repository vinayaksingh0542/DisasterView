version: '3.8'

services:
  db:
    image: postgres:15
    container_name: disasterview-db
    environment:
      POSTGRES_USER: disaster_user
      POSTGRES_PASSWORD: disaster_password
      POSTGRES_DB: disasterview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
